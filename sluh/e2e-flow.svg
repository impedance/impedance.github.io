<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-label="E2E поток SLUH">
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#59636d"/></marker></defs>
<g class="step active" data-step="sensor"><rect x="40" y="42" width="180" height="78" rx="14" fill="#fff0e6" stroke="#b85c27" stroke-width="2"/><text x="130" y="68" text-anchor="middle" font-size="13" font-weight="850"><tspan x="130" dy="0">1 · Sensor / Simulator</tspan><tspan x="130" dy="17">датчик или симулятор</tspan></text><text x="130" y="104" text-anchor="middle" font-size="11" fill="#68717a">создаёт Observation</text></g>
<g class="step" data-step="intake"><rect x="300" y="42" width="180" height="78" rx="14" fill="#eaf0ff" stroke="#2457d6" stroke-width="2"/><text x="390" y="68" text-anchor="middle" font-size="13" font-weight="850"><tspan x="390" dy="0">2 · Observation</tspan><tspan x="390" dy="17">Intake</tspan></text><text x="390" y="104" text-anchor="middle" font-size="10" fill="#68717a">проверка · дедупликация</text></g>
<g class="step" data-step="algo"><rect x="560" y="42" width="260" height="78" rx="14" fill="#fff0e6" stroke="#b85c27" stroke-width="2"/><text x="690" y="72" text-anchor="middle" font-size="14" font-weight="850">3 · Recognition / Position / Tracking</text><text x="690" y="96" text-anchor="middle" font-size="11" fill="#68717a">результаты внешних модулей с версиями</text></g>
<g stroke="#59636d" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M220 81H300"/><path d="M480 81H560"/></g>

<g class="step" data-step="target"><rect x="560" y="190" width="260" height="78" rx="14" fill="#eaf0ff" stroke="#2457d6" stroke-width="2"/><text x="690" y="220" text-anchor="middle" font-size="14" font-weight="850">4 · PotentialTarget / Track</text><text x="690" y="244" text-anchor="middle" font-size="11" fill="#68717a">текущее состояние + история</text></g>
<g class="step" data-step="map"><rect x="300" y="190" width="180" height="78" rx="14" fill="#eaf0ff" stroke="#2457d6" stroke-width="2"/><text x="390" y="220" text-anchor="middle" font-size="14" font-weight="850">5 · Карта оператора</text><text x="390" y="242" text-anchor="middle" font-size="10" fill="#68717a"><tspan x="390" dy="0">несколько целей · обновления</tspan><tspan x="390" dy="13">в реальном времени</tspan></text></g>
<g class="step" data-step="audio"><rect x="40" y="190" width="180" height="78" rx="14" fill="#eaf0ff" stroke="#2457d6" stroke-width="2"/><text x="130" y="220" text-anchor="middle" font-size="14" font-weight="850">6 · Аудио (Audio)</text><text x="130" y="244" text-anchor="middle" font-size="11" fill="#68717a">воспроизведение связанного аудио</text></g>
<g stroke="#59636d" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M690 120V190"/><path d="M560 229H480"/><path d="M300 229H220"/></g>

<g class="step" data-step="decision"><rect x="40" y="340" width="180" height="78" rx="14" fill="#eaf0ff" stroke="#2457d6" stroke-width="2"/><text x="130" y="370" text-anchor="middle" font-size="14" font-weight="850">7 · Confirm / Reject</text><text x="130" y="394" text-anchor="middle" font-size="11" fill="#68717a">idempotent действие</text></g>
<g class="step" data-step="evidence"><rect x="300" y="340" width="180" height="78" rx="14" fill="#e9f5ee" stroke="#2f7454" stroke-width="2"/><text x="390" y="370" text-anchor="middle" font-size="14" font-weight="850">8 · Evidence — свидетельства</text><text x="390" y="394" text-anchor="middle" font-size="11" fill="#68717a">решение + trace сохранены</text></g>
<g class="step" data-step="gt"><rect x="560" y="340" width="260" height="78" rx="14" fill="#fff0e6" stroke="#b85c27" stroke-width="2"/><text x="690" y="370" text-anchor="middle" font-size="14" font-weight="850">9 · Ground Truth — сравнение</text><text x="690" y="394" text-anchor="middle" font-size="11" fill="#68717a">независимые свидетельства</text></g>
<g stroke="#59636d" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M130 268V340"/><path d="M220 379H300"/><path d="M480 379H560"/></g>

<g class="step" data-step="customer"><rect x="300" y="492" width="340" height="82" rx="14" fill="#fffdf9" stroke="#20252b" stroke-width="2"/><text x="470" y="524" text-anchor="middle" font-size="15" font-weight="900">10 · Customer Decision — решение заказчика</text><text x="470" y="550" text-anchor="middle" font-size="11" fill="#68717a">продолжить · пересмотреть · остановить</text></g>
<path d="M690 418V454H470V492" fill="none" stroke="#59636d" stroke-width="2" marker-end="url(#a)"/>
<text x="446" y="151" text-anchor="middle" font-size="11" fill="#68717a">correlation ID · временные метки · версии алгоритмов</text>
<text x="446" y="300" text-anchor="middle" font-size="11" fill="#68717a">OperatorDecision не изменяет жизненный цикл Track</text>
<text x="446" y="454" text-anchor="middle" font-size="11" fill="#68717a">Ground Truth не создаётся самой системой</text>
</svg>
